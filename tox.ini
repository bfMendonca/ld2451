[tox]
envlist = py39, py310, py311, py312, py313, lint
isolated_build = true

[testenv]
extras = dev
commands =
    pytest --cov --cov-report=term-missing {posargs}
    coverage report --include=ld2451/framing.py,ld2451/protocol.py --fail-under=90

[testenv:lint]
basepython = python3.9
extras = dev
commands =
    ruff check .
    ruff format --check .
    mypy
    mypy --platform linux
