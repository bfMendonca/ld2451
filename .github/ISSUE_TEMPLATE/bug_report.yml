name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands or code. A `ld2451 record` capture attached here helps a lot.
      render: shell
  - type: textarea
    id: info
    attributes:
      label: Environment
      description: Output of `ld2451 --version` and `ld2451 info`, Python version, board and OS.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output with `-vv`, if relevant.
      render: text
